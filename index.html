<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RMRZ Inventory</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>
<body>
<header><h1>RMRZ Inventory</h1><span id="status">Connecting…</span></header>
<main>
  <section class="card">
    <h2>Add / Update Product</h2>
    <form id="productForm">
      <input type="hidden" id="productId">
      <label>Barcode <input id="barcode" required></label>
      <label>Product name <input id="name" required></label>
      <label>Price <input id="price" type="number" step="0.01" min="0"></label>
      <label>Stock <input id="stock" type="number" step="1" min="0" value="0"></label>
      <div class="buttons"><button type="submit">Save product</button><button type="button" id="clearBtn">Clear</button></div>
    </form>
  </section>

  <section class="card">
    <div class="toolbar"><h2>Products</h2><input id="search" placeholder="Search name or barcode"></div>
    <div id="message"></div>
    <div class="tableWrap"><table><thead><tr><th>Barcode</th><th>Product</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>

<dialog id="labelDialog">
  <div class="label">
    <div id="labelName"></div>
    <svg id="barcodeSvg"></svg>
  </div>
  <div class="dialogButtons"><button id="printBtn">Print label</button><button id="closeBtn">Close</button></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
